name: Deploy to GitHub Pages

# 推送到 main 即自动构建并发布；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，新的推送取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # 站点发布在 https://runlinxin-arch.github.io/protofile/
        # 绑定自定义域名后，把这两个值改成新域名（BASE_PATH 留空）
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /protofile
          NEXT_PUBLIC_SITE_URL: https://runlinxin-arch.github.io/protofile
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
